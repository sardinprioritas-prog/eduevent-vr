<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storyboard Animasi — Masuk ke Ruang Virtual</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f24;color:#eaf0ff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px;min-height:100vh}
h1{font-size:22px}.sub{color:#9fb0d9;font-size:13px}
#stage{position:relative;width:920px;max-width:96vw;aspect-ratio:920/440;border-radius:20px;overflow:hidden;background:#0d1330;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid #ffffff14}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.scene.on{opacity:1}
#cap{position:absolute;left:0;right:0;bottom:0;padding:26px 18px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:14px;letter-spacing:.3px;z-index:9}
#dots{display:flex;gap:8px}
#dots button{width:12px;height:12px;border-radius:50%;border:none;background:#33406e;cursor:pointer}
#dots button.on{background:#00e0ff;box-shadow:0 0 10px #00e0ff}
#replay{background:#1d7ed8;color:#fff;border:none;padding:9px 18px;border-radius:999px;cursor:pointer;font-size:14px}
#legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.card{background:#131a3d;border:1px solid #ffffff12;border-radius:14px;padding:10px 16px;text-align:center}
.card svg{animation:bob 2.4s ease-in-out infinite}
.card b{display:block;font-size:13px;margin-top:2px}
.card span{font-size:11px;color:#9fb0d9}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
/* koridor (dipakai scene 1 & 2) */
.corr .wall{position:absolute;inset:0 0 40% 0;background:linear-gradient(#1a2650,#121a3d)}
.corr .floor{position:absolute;inset:60% 0 0 0;background:repeating-linear-gradient(90deg,#202c5e 0 64px,#182250 64px 128px)}
/* S1 */
.s1 .doorframe{position:absolute;right:56px;bottom:40%;width:180px;height:52%;background:#05081a;border:4px solid #2de1c2;border-radius:14px 14px 0 0;box-shadow:0 0 26px #2de1c288}
.s1 .sign,.s2 .sign{position:absolute;top:-36px;left:50%;transform:translateX(-50%);background:#0c1430;border:2px solid #2de1c2;color:#2de1c2;font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;letter-spacing:2px;white-space:nowrap}
.s1 .glow{position:absolute;inset:8px;background:radial-gradient(circle at 50% 70%,#2de1c255,transparent 65%);animation:pulse 2.4s infinite}
.s1 .walker{position:absolute;bottom:6%;animation:walk 9s linear infinite}
.s1 .walker svg{animation:bob .55s ease-in-out infinite}
@keyframes walk{from{left:-120px}to{left:104%}}
/* S2 */
.s2 .doorframe{position:absolute;left:50%;bottom:40%;width:190px;height:54%;margin-left:-95px;background:#05081a;border:4px solid #1d7ed8;border-radius:14px 14px 0 0}
.s2 .beams{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#7a5cffcc,#00e0ff44 45%,transparent 70%);animation:pulse 3.2s infinite}
.dp{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(#16204a,#0c1233);border:2px solid #1d7ed8}
.dp.l{left:0;border-right:none;border-radius:12px 0 0 0}.dp.r{right:0;border-left:none;border-radius:0 12px 0 0}
.s2 .dp.l{animation:doL 7s ease-in-out infinite}.s2 .dp.r{animation:doR 7s ease-in-out infinite}
@keyframes doL{0%,100%{transform:translateX(0)}18%,72%{transform:translateX(-88%)}}
@keyframes doR{0%,100%{transform:translateX(0)}18%,72%{transform:translateX(88%)}}
.s2 .sensor{position:absolute;left:calc(50% - 112px);bottom:56%;width:16px;height:24px;background:#0c1430;border:2px solid #ffd166;border-radius:4px;animation:pulse 1s infinite}
.s2 .ripple{position:absolute;left:calc(50% - 119px);bottom:56.5%;width:14px;height:14px;border:2px solid #ffd166;border-radius:50%;animation:rip 2.2s infinite}
@keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(3);opacity:0}}
.s2 .stand{position:absolute;bottom:7%;width:86px;text-align:center}
.s2 .stand svg{animation:bob 2.2s ease-in-out infinite}
.s2 .tag{margin-top:-6px;font-size:11px;background:#0c1430cc;border:1px solid #ffffff22;border-radius:6px;padding:2px 8px;display:inline-block}
/* S3 */
.s3{background:radial-gradient(circle at 50% 45%,#1b1140,#0a0d24 70%)}
.portal{position:absolute;left:72%;top:46%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:conic-gradient(#ff2fb9,#7a5cff,#00e0ff,#8affd7,#ff2fb9);animation:spin 2.6s linear infinite;box-shadow:0 0 60px #7a5cff99}
.portal::after{content:"";position:absolute;inset:30px;border-radius:50%;background:radial-gradient(circle,#0a0d24 60%,#1b1140);box-shadow:inset 0 0 50px #7a5cff}
.s3 .leap{position:absolute;bottom:10%;left:4%;animation:leap 4.6s cubic-bezier(.55,0,.9,.4) infinite}
@keyframes leap{0%{transform:translate(0,0) scale(1);opacity:1}55%{transform:translate(430px,-130px) scale(.8);opacity:1}92%{transform:translate(600px,-6px) scale(.08);opacity:.9}100%{transform:translate(608px,0) scale(.03);opacity:0}}
.s3 .wow{position:absolute;left:34%;top:14%;font-size:34px;font-weight:900;color:#8affd7;text-shadow:0 0 18px #00e0ff;animation:pop 4.6s infinite}
@keyframes pop{0%,55%{transform:scale(0);opacity:0}65%{transform:scale(1.25);opacity:1}75%{transform:scale(1)}95%,100%{transform:scale(.8);opacity:0}}
/* S4 */
.s4{background:radial-gradient(circle at 50% 50%,#141b45,#070a1e 75%)}
.star{position:absolute;display:inline-block;background:#fff;border-radius:50%;animation:twk 3s infinite}
@keyframes twk{0%,100%{opacity:.15}50%{opacity:.9}}
.sun{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:radial-gradient(circle,#fff7ae,#ffb703 55%,#fb8500);box-shadow:0 0 70px #ffb703aa;animation:pulse 3s infinite}
.orbit{position:absolute;left:50%;top:50%;border:1px dashed rgba(255,255,255,.16);border-radius:50%;animation:spin linear infinite}
.orbit .pl{position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%}
.o1{width:170px;height:170px;margin:-85px 0 0 -85px;animation-duration:7s}.o1 .pl{background:#f87171}
.o2{width:290px;height:290px;margin:-145px 0 0 -145px;animation-duration:14s}.o2 .pl{background:#67e8f9}
.o3{width:420px;height:420px;margin:-210px 0 0 -210px;animation-duration:26s}.o3 .pl{width:26px;height:26px;margin-left:-13px;top:-13px;background:#fb923c;box-shadow:0 0 12px #fb923c}
.holo{position:absolute;left:18px;top:16px;background:#0c1430cc;border:1px solid #00e0ff66;color:#aef3ff;font-size:12px;padding:8px 12px;border-radius:10px;animation:pulse 2.6s infinite;line-height:1.5}
.s4 .float{position:absolute;filter:drop-shadow(0 0 10px #7a5cffcc);animation:floaty 4.2s ease-in-out infinite}
.f1{left:16%;top:13%}.f2{right:15%;top:11%;animation-delay:-1s}.f3{left:11%;top:50%;animation-delay:-2s}.f4{right:12%;top:48%;animation-delay:-3s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
</style>
</head>
<body>
<h1>🎬 Masuk ke Ruang Virtual</h1>
<p class="sub">Storyboard animasi · 4 siswa SD & SMP · pembelajaran berbasis Virtual Reality</p>
<div id="stage">
  <div class="scene corr s1" id="sc1"></div>
  <div class="scene corr s2" id="sc2"></div>
  <div class="scene s3" id="sc3"></div>
  <div class="scene s4" id="sc4"></div>
  <div id="cap"></div>
</div>
<div id="dots"></div>
<button id="replay">▶ Putar Ulang</button>
<div id="legend"></div>

<script>
const K={
 raka:{name:'Raka',grade:'Siswa SD',top:'#e63946',trim:'#fff',skin:'#f3c39a',hair:'#2b2b2b',style:'spiky'},
 nadia:{name:'Nadia',grade:'Siswa SD',top:'#e63946',trim:'#fff',skin:'#f7d3b0',hair:'#4a2c17',style:'tails'},
 bima:{name:'Bima',grade:'Siswa SMP',top:'#f8f9fa',trim:'#1d7ed8',skin:'#e8b88a',hair:'#111',style:'flat',taller:1},
 salsa:{name:'Salsa',grade:'Siswa SMP',top:'#f8f9fa',trim:'#1d7ed8',skin:'#f3c39a',hijab:'#8d99ae',glasses:1,style:'hijab'}
};
function kidSVG(k,w=86){
  const bh=k.taller?58:50, legY=56+bh;
  let back='',hair='',extra='';
  if(k.style==='hijab'){back=`<circle cx="50" cy="36" r="27" fill="${k.hijab}"/>`;}
  else{
    hair = k.style==='spiky'
      ? `<path d="M28 32 Q31 12 50 11 Q69 12 72 32 L66 25 L61 30 L55 23 L50 28 L45 22 L39 29 L34 24 Z" fill="${k.hair}"/>`
      : k.style==='flat'
      ? `<path d="M28 32 Q32 11 50 11 Q68 11 72 32 Q50 21 28 32Z" fill="${k.hair}"/>`
      : `<path d="M28 33 Q32 12 50 11 Q68 12 72 33 Q50 21 28 33Z" fill="${k.hair}"/><circle cx="23" cy="36" r="8" fill="${k.hair}"/><circle cx="77" cy="36" r="8" fill="${k.hair}"/><circle cx="27" cy="29" r="3" fill="#ffd166"/><circle cx="73" cy="29" r="3" fill="#ffd166"/>`;
  }
  if(k.glasses){extra=`<circle cx="42" cy="34" r="6" fill="none" stroke="#222" stroke-width="2"/><circle cx="58" cy="34" r="6" fill="none" stroke="#222" stroke-width="2"/><line x1="48" y1="34" x2="52" y2="34" stroke="#222" stroke-width="2"/>`;}
  const face=`<circle cx="50" cy="34" r="${k.style==='hijab'?19:21}" fill="${k.skin}"/>`;
  const eyes=`<ellipse class="eye" cx="42" cy="34" rx="2.6" ry="3.4" fill="#222"/><ellipse class="eye" cx="58" cy="34" rx="2.6" ry="3.4" fill="#222"/>`;
  const mouth=`<path d="M44 43 Q50 48 56 43" stroke="#b5485d" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const body=`<rect x="29" y="56" width="42" height="${bh}" rx="14" fill="${k.top}"/><rect x="29" y="56" width="42" height="11" rx="5.5" fill="${k.trim}"/>`;
  const legs=`<rect x="36" y="${legY}" width="9" height="27" rx="4.5" fill="#1f2a4d"/><rect x="55" y="${legY}" width="9" height="27" rx="4.5" fill="#1f2a4d"/>`;
  const arms=`<rect x="18" y="60" width="9" height="30" rx="4.5" fill="${k.top}" transform="rotate(15 22.5 62)"/><rect x="73" y="60" width="9" height="30" rx="4.5" fill="${k.top}" transform="rotate(-15 77.5 62)"/>`;
  return `<svg viewBox="0 0 100 ${legY+30}" width="${w}" style="display:block">${back}${face}${hair}${extra}${eyes}${mouth}${arms}${body}${legs}</svg>`;
}
const R=id=>document.getElementById(id);

/* Scene 1 — koridor */
R('sc1').innerHTML=`
 <div class="wall"></div><div class="floor"></div>
 <div class="doorframe"><div class="glow"></div><div class="sign">VR LEARNING LAB</div></div>
 <div class="walker" style="animation-delay:-0s">${kidSVG(K.raka)}</div>
 <div class="walker" style="animation-delay:-.6s">${kidSVG(K.nadia)}</div>
 <div class="walker" style="animation-delay:-1.1s">${kidSVG(K.bima)}</div>
 <div class="walker" style="animation-delay:-1.5s">${kidSVG(K.salsa)}</div>`;

/* Scene 2 — sensor & pintu terbuka */
R('sc2').innerHTML=`
 <div class="wall"></div><div class="floor"></div>
 <div class="doorframe"><div class="beams"></div><div class="dp l"></div><div class="dp r"></div><div class="sign">SELAMAT DATANG</div></div>
 <div class="sensor"></div><div class="ripple"></div>
 <div class="stand" style="left:6%">${kidSVG(K.raka)}<div class="tag">Raka</div></div>
 <div class="stand" style="left:17%">${kidSVG(K.nadia)}<div class="tag">Nadia</div></div>
 <div class="stand" style="left:28%">${kidSVG(K.bima)}<div class="tag">Bima</div></div>
 <div class="stand" style="left:39%">${kidSVG(K.salsa)}<div class="tag">Salsa</div></div>`;

/* Scene 3 — lompat ke portal */
R('sc3').innerHTML=`
 <div class="portal"></div><div class="wow">WOOOW!</div>
 <div class="leap" style="animation-delay:0s">${kidSVG(K.raka,80)}</div>
 <div class="leap" style="animation-delay:-.4s">${kidSVG(K.nadia,80)}</div>
 <div class="leap" style="animation-delay:-.8s">${kidSVG(K.bima,80)}</div>
 <div class="leap" style="animation-delay:-1.2s">${kidSVG(K.salsa,80)}</div>`;

/* Scene 4 — ruang virtual tata surya */
let stars='';
for(let i=0;i<70;i++){const s=(1+Math.random()*2.2).toFixed(1);
 stars+=`<i class="star" style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${s}px;animation-delay:-${(Math.random()*3).toFixed(1)}s"></i>`;}
R('sc4').innerHTML=`${stars}<div class="sun"></div>
 <div class="orbit o1"><span class="pl"></span></div>
 <div class="orbit o2"><span class="pl"></span></div>
 <div class="orbit o3"><span class="pl"></span></div>
 <div class="holo">🪐 JUPITER · ⌀ 139.820 km<br>🌍 BUMI · ⌀ 12.742 km</div>
 <div class="float f1">${kidSVG(K.raka,76)}</div>
 <div class="float f2">${kidSVG(K.nadia,76)}</div>
 <div class="float f3">${kidSVG(K.bima,76)}</div>
 <div class="float f4">${kidSVG(K.salsa,76)}</div>`;

/* Legenda karakter */
R('legend').innerHTML=Object.values(K).map(k=>`<div class="card">${kidSVG(k,64)}<b>${k.name}</b><span>${k.grade}</span></div>`).join('');

/* Pemutar scene */
const scenes=[...document.querySelectorAll('.scene')],dots=R('dots');
const CAPS=[
 '🎬 Shot 1–3 · Koridor Sekolah — berpacu menuju VR Learning Lab',
 '🎫 Shot 4–6 · Bima memindai kartu siswa — pintu sensor terbuka',
 '🌀 Shot 7–9 · LOMPAT! Masuk ke portal virtual',
 '🪐 Shot 10–15 · Ruang Virtual: belajar Tata Surya bersama'];
let cur=0,timer;
scenes.forEach((s,i)=>{const b=document.createElement('button');b.onclick=()=>{show(i);reset()};dots.appendChild(b);});
function show(i){cur=i;scenes.forEach((s,j)=>s.classList.toggle('on',j===i));
 [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i));R('cap').textContent=CAPS[i];}
function reset(){clearInterval(timer);timer=setInterval(()=>show((cur+1)%4),6500);}
R('replay').onclick=()=>{show(0);reset();};
show(0);reset();
</script>
</body>
</html>
